test:
  name: Benchmark Hyperledger Fabric - SmartBFT
  description: Teste para encontrar o ponto de saturação da rede SmartBFT

  workers:
    number: 2

  rounds:

    # -------------------------------------------------------
    # WARM-UP: popula o ledger com 1000 assets antes das
    # baterias de transferência.
    # -------------------------------------------------------
    - label: Aquecimento-Ledger
      description: Populacao inicial do ledger
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload/warmup.js

    # -------------------------------------------------------
    # TESTES DE SATURAÇÃO
    # -------------------------------------------------------

    - label: transferAsset - 100tps
      description: Leitura e escrita a 100 TPS (~30s)
      txNumber: 3000
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload/transferAsset.js
        arguments:
          totalAssets: 1000

    - label: transferAsset - 200tps
      description: Leitura e escrita a 200 TPS (~30s)
      txNumber: 6000
